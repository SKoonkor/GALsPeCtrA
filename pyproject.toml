[project]
name = "galspectra"
version = "0.1.0"
description = "SED generation and PCA-based analysis pipeline for galaxy spectra"
authors = [{name="Suttikoon"}]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pyyaml",
    "astropy",
    "matplotlib",
]

[project.optional-dependencies]
# Test suite. Install with:  pip install -e ".[dev]"  then run:  pytest
dev = [
    "pytest",
]
# scripts/colour_cut_calibration.py only (reads the GALFORM lightcone HDF5 + a
# comparison table). Install with:  pip install -e ".[colour-cut]"
colour-cut = [
    "h5py",
    "pandas",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ is on the path so tests can import the batch drivers directly.
pythonpath = ["src", "scripts"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
galspectra = "galspectra.cli:main"
