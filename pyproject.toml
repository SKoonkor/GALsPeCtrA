[project]
name = "galspectra"
version = "0.1.0"
description = "SED generation and analysis pipeline using FSPS"
authors = [{name="Suttikoon"}]
dependencies = [
    "numpy",
    "scipy",
    "pyyaml"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
galspectra = "galspectra.cli:main"
